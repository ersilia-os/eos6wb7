Status: Ready
Title: Antimicrobial activity prediction against Klebsiella pneumoniae from 
  public ChEMBL data
Description: Assesses whether a compound inhibits Klebsiella pneumoniae, a Gram-negative
  pathogen in which carbapenem resistance has spread widely and treatment options
  are correspondingly narrow. Ten classifiers were trained over separate ChEMBL bioactivity
  pools, with single-point and dose-response assays modelled apart, and combined through
  a quality-weighted consensus. The thick capsule characteristic of this organism
  contributes to intrinsic resistance that structure-based prediction cannot capture.
